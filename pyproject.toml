[project]
name = "cartpole-term"
version = "0.1.0"
description = "SmallFall: fall prediction and a protective falling policy for the Unitree Go1 in mjlab (plus the original cartpole termination-predictor study)"
requires-python = ">=3.10"
dependencies = [
    "mjlab",
    "scikit-learn",
    "imageio[ffmpeg]",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false
